[package]
name = "pitchary"
version = "0.5.0"
description = "Local customer, sales and invoice management"
authors = ["Oliver Jessner"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
