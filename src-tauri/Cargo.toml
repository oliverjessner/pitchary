[package]
name = "pitchary"
version = "0.6.0"
description = "Local customer, sales and invoice management"
authors = ["Oliver Jessner"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.20.0", default-features = false }
objc2 = "=0.6.5"

[[test]]
name = "dock_menu"
path = "tests/dock_menu.rs"
harness = false

[profile.release]
# Rust/LLVM stripping can misalign Mach-O dylibs and prevent proc-macro loading.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"
lto = "thin"
codegen-units = 1
