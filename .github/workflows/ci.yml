name: Verify CRM
on: [push, pull_request]
jobs:
  glib-backport:
    name: GLib security backport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - name: Run optimized upstream iterator regression tests
        run: cargo test --manifest-path src-tauri/vendor/glib/Cargo.toml --release --lib variant_iter::tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
