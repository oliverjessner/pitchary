<!doctype html>
<html lang="de" data-oj-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pitchary – Kunden, Angebote und Finanzen lokal verwalten."
    />
    <title>Pitchary</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/oj-designsystem/styles.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/finance.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body class="oj-app">
    <a class="oj-skip-link" href="#main"
      ><span data-i18n="Zum Inhalt">Zum Inhalt</span></a
    >
    <div class="app-shell">
      <aside class="app-sidebar">
        <a class="brand oj-link" href="#/dashboard"
          ><i class="fa-solid fa-layer-group" aria-hidden="true"></i
          ><span
            >pitchary<span class="brand-subtitle oj-muted"
              ><span data-i18n="CRM &amp; Finanzen"
                >CRM &amp; Finanzen</span
              ></span
            ></span
          ></a
        >
        <nav
          class="oj-sidebar-nav"
          data-i18n-aria-label="Hauptnavigation"
          aria-label="Hauptnavigation"
        >
          <a class="oj-nav-link" href="#/dashboard"
            ><i class="fa-solid fa-chart-simple" aria-hidden="true"></i
            ><span data-i18n="Dashboard">Dashboard</span></a
          >
          <a class="oj-nav-link" href="#/customers"
            ><i class="fa-solid fa-building" aria-hidden="true"></i
            ><span data-i18n="Kunden">Kunden</span></a
          >
          <a class="oj-nav-link" href="#/employees"
            ><i class="fa-solid fa-users" aria-hidden="true"></i
            ><span data-i18n="Personen">Personen</span></a
          >
          <a class="oj-nav-link" href="#/services"
            ><i class="fa-solid fa-briefcase" aria-hidden="true"></i
            ><span data-i18n="Dienstleistungen">Dienstleistungen</span></a
          >
          <a class="oj-nav-link" href="#/pipeline"
            ><i class="fa-solid fa-table-columns" aria-hidden="true"></i
            ><span data-i18n="Pipeline">Pipeline</span></a
          >
          <a class="oj-nav-link" href="#/analytics"
            ><i class="fa-solid fa-chart-line" aria-hidden="true"></i
            ><span data-i18n="Analytics">Analytics</span></a
          >
          <a class="oj-nav-link" href="#/invoices"
            ><i class="fa-solid fa-file-invoice" aria-hidden="true"></i
            ><span data-i18n="Rechnungen">Rechnungen</span></a
          >
          <a class="oj-nav-link" href="#/finance-customers"
            ><i class="fa-solid fa-chart-column" aria-hidden="true"></i
            ><span data-i18n="Umsatz">Umsatz</span></a
          >
          <a class="oj-nav-link" href="#/finance-settings"
            ><i class="fa-solid fa-gear" aria-hidden="true"></i
            ><span data-i18n="Einstellungen">Einstellungen</span></a
          >
        </nav>
        <div class="sidebar-footer oj-small oj-muted">
          <i class="fa-solid fa-lock" aria-hidden="true"></i
          ><span data-i18n="Lokal auf deinem Rechner"
            >Lokal auf deinem Rechner</span
          >
        </div>
      </aside>
      <div class="app-content">
        <header class="app-topbar">
          <span class="oj-small oj-muted"
            ><span data-i18n="Kunden. Angebote. Finanzen."
              >Kunden. Angebote. Finanzen.</span
            ></span
          ><a
            class="oj-button oj-button-primary oj-button-compact"
            href="#/new-offer"
            ><i class="fa-solid fa-plus" aria-hidden="true"></i
            ><span data-i18n="Neues Angebot">Neues Angebot</span></a
          >
        </header>
        <main
          id="main"
          tabindex="-1"
          class="view oj-stack"
          aria-busy="true"
        ></main>
      </div>
    </div>
    <div id="dialogs"></div>
    <noscript
      ><p class="oj-alert oj-alert-warning">
        Bitte JavaScript aktivieren, um Pitchary zu verwenden.
      </p></noscript
    >
  </body>
</html>
